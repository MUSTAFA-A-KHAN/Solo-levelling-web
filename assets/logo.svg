<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#8a2be2"/>
      <stop offset="100%" stop-color="#ff00ff"/>
    </linearGradient>
    <filter id="logoGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="96" fill="none"/>
  <g filter="url(#logoGlow)">
    <rect x="64" y="64" width="384" height="384" rx="56" fill="none" stroke="url(#logoGrad)" stroke-width="4" opacity="0.85"/>
  </g>
  <g transform="translate(256 256)">
    <g filter="url(#logoGlow)">
      <circle cx="0" cy="0" r="80" fill="url(#logoGrad)"/>
    </g>
    <g font-family="'Courier New', monospace" font-weight="700" font-size="120" fill="white" text-anchor="middle" dominant-baseline="central">S</g>
  </g>
  <g font-family="Orbitron, sans-serif" font-weight="700" font-size="112" fill="url(#logoGrad)" text-anchor="middle" dominant-baseline="central" transform="translate(256 400)">
    YS
  </g>
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#logoGrad)" stroke-width="2" stroke-dasharray="8 16" opacity="0.55"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#logoGrad)" stroke-width="2" stroke-dasharray="8 16" opacity="0.35"/>
</svg>
