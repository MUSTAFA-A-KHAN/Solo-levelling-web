    <main>
        <section class="section" style="padding-top: 6rem;">
            <div class="container" style="max-width: 800px; margin: 0 auto;">
                <h1 class="section-title" data-tag="REACH OUT TO THE SYSTEM">CONTACT</h1>
                <p class="section-desc">Have a question, found a bug, or want to suggest a feature? The System is listening. Drop a line and we'll respond as soon as we're done grinding our daily quests.</p>

                <div class="glass" id="download-form" style="padding: 2.5rem; margin: 0 auto;">
                    <form id="contactForm" style="display: flex; flex-direction: column; gap: 1.25rem;">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
                            <input type="text" name="name" placeholder="CALL SIGN" required
                                   style="background: var(--clr-panel); border: 1px solid var(--clr-panel-border); border-radius: 12px; padding: 0.85rem 1rem; color: var(--clr-text); font-family: var(--font-ui); font-size: 0.9rem; outline: none; transition: var(--transition);">
                            <input type="email" name="email" placeholder="FREQUENCY (EMAIL)" required
                                   style="background: var(--clr-panel); border: 1px solid var(--clr-panel-border); border-radius: 12px; padding: 0.85rem 1rem; color: var(--clr-text); font-family: var(--font-ui); font-size: 0.9rem; outline: none; transition: var(--transition);">
                        </div>
                        <input type="text" name="subject" placeholder="SUBJECT" required
                               style="background: var(--clr-panel); border: 1px solid var(--clr-panel-border); border-radius: 12px; padding: 0.85rem 1rem; color: var(--clr-text); font-family: var(--font-ui); font-size: 0.9rem; outline: none; transition: var(--transition);">
                        <textarea name="message" placeholder="YOUR MESSAGE" rows="5" required
                                  style="background: var(--clr-panel); border: 1px solid var(--clr-panel-border); border-radius: 12px; padding: 0.85rem 1rem; color: var(--clr-text); font-family: var(--font-body); font-size: 0.9rem; outline: none; resize: vertical; transition: var(--transition);"></textarea>
                        <button type="submit" class="btn btn--primary">TRANSMIT</button>
                    </form>
                </div>

                <div class="flex-center-gap" style="margin-top: 2rem; gap: 2rem; flex-wrap: wrap;">
                    <div class="flex-col" style="gap: 0.4rem;">
                        <div class="contact-label">EMAIL</div>
                        <div style="color: var(--clr-text-bright);">support@syslevel.app</div>
                    </div>
                    <div class="flex-col" style="gap: 0.4rem;">
                        <div class="contact-label">GITHUB</div>
                        <div style="color: var(--clr-text-bright);"><a href="https://github.com/MUSTAFA-A-KHAN/Solo-levelling-web" target="_blank" rel="noopener" style="color: var(--clr-primary);">open-source</a></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">

            <span class="footer-copy">© 2026 SYS:LEVEL — SYSTEM ONLINE</span>
        </div>
    </footer>

    <script>
      document.getElementById('contactForm')?.addEventListener('submit', (e) => {
        e.preventDefault();
        const form = e.target;
        form.reset();
        const note = document.createElement('div');
        note.textContent = 'TRANSMISSION RECEIVED. We will reply soon.';
        note.style.cssText = 'margin-top:1rem;color:var(--clr-success);font-family:var(--font-ui);font-weight:700;';
        form.parentNode.appendChild(note);
        setTimeout(() => note.remove(), 4000);
      });
    </script>
